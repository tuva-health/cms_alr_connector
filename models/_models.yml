version: 1

models:
### final
  - name: provider_attribution
    description: Provider attribution table mapping ALR top NPI and TIN to Tuva input layer format
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_input_layer{% else %}input_layer{%- endif -%}

  - name: enrollment
    description: Final enrollment table in the source format for the CCLF connector
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_raw_data{% else %}raw_data{%- endif -%}

### intermediate
  - name: aalr_history
    description: >
      Combined table of all historical assignment list reports, pivoted to one
      row per beneficiary, month and Table 1-1 file. Tables 1-2, 1-4, 1-6 and
      1-9 are joined from the same delivery as the Table 1-1 row.
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_input_layer{% else %}input_layer{%- endif -%}
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [bene_mbi_id, enroll_month, file_name]

  - name: aalr_governing_file
    description: >
      The ALR that governs each enrollment month, one row per ACO and month: of
      the delivered files whose EnrollFlag1..12 cover the month, the earliest
      performance year, then the lowest mssp_file_parameters priority (benchmark
      last within its performance year), then the latest T-stamp. Benchmark ALRs
      ship with the following performance year, so one governs only months no
      earlier performance year's file covers. Join any ALR table to it on (aco_id,
      performance_year, file_period, t_stamp) to read that table from the
      governing file.
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_input_layer{% else %}input_layer{%- endif -%}
    columns:
      - name: aco_id
        description: ACO ID, the second dot-separated part of file_name (A<ACO>).
      - name: enroll_month
        description: First day of the enrollment month.
      - name: performance_year
        description: Performance year of the governing file, as in the staging models.
      - name: file_period
        description: Report period of the governing file (e.g. 2025Q3, Y2024), as in the staging models.
      - name: t_stamp
        description: Delivery T-stamp of the governing file, ITERATION without its _1-<table> suffix (e.g. T0310000).
      - name: file_name
        description: The governing file's Table 1-1 file name.
      - name: priority
        description: mssp_file_parameters priority of the governing file.
      - name: alr_file_type
        description: mssp_file_parameters file_type of the governing file (initial, quarterly, benchmark).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [aco_id, enroll_month]

  - name: aalr_history_filtered
    description: >
      One row per beneficiary and enrollment month, from the ALR that governs
      the month (aalr_governing_file). A beneficiary the governing file does not
      list has no row for that month. It does not carry the Table 1-5 turnover
      reasons; they are on aalr_history.
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_input_layer{% else %}input_layer{%- endif -%}

### staging
  - name: stg_aalr1_assigned_beneficiaries
    description: Staged version of the raw aalr1_assigned_beneficiaries table
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_input_layer{% else %}input_layer{%- endif -%}

  - name: stg_aalr2_assigned_beneficiaries_tin
    description: Staged version of the raw aalr2_assigned_beneficiaries_tin table
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_input_layer{% else %}input_layer{%- endif -%}

  - name: stg_aalr4_assigned_beneficiaries_tin_npi
    description: Staged version of the raw aalr4_assigned_beneficiaries_tin_npi table
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_input_layer{% else %}input_layer{%- endif -%}

  - name: stg_aalr5_beneficiary_turnover
    description: Staged version of the raw aalr5_beneficiary_turnover table
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_input_layer{% else %}input_layer{%- endif -%}

  - name: stg_aalr6_beneficiaries_assignable_or_voluntary
    description: Staged version of the raw aalr6_beneficiaries_assignable_or_voluntary table
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_input_layer{% else %}input_layer{%- endif -%}

  - name: stg_aalr9_beneficiaries_underserved
    description: Staged version of the raw aalr9_beneficiaries_underserved table
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_input_layer{% else %}input_layer{%- endif -%}

unit_tests:
  - name: stg_aalr1_keeps_cms_score_precision
    description: >
      The CMS-HCC risk scores and the dual-eligible person-years fraction keep
      all 14 decimals CMS ships. The expected output is written as SQL on purpose:
      a dict-format expectation is cast to the model's actual column type before
      comparison, so it would pass even when the model truncates to two decimals.
    model: stg_aalr1_assigned_beneficiaries
    given:
      - input: source('cms_ssp_reports', 'aalr1_assigned_beneficiaries')
        # A file name keeps extract_file_metadata() deterministic: with a null
        # name its concat() yields '20' on some adapters and null on others.
        rows:
          - file_name: 'P.A0001.ACO.AALR.2023Q4.D231001.T0000000_1-1.csv'
            bene_rsk_r_scre_01: '1.01345678901234'
            bene_rsk_r_scre_02: '1.02345678901234'
            bene_rsk_r_scre_03: '1.03345678901234'
            bene_rsk_r_scre_04: '1.04345678901234'
            bene_rsk_r_scre_05: '1.05345678901234'
            bene_rsk_r_scre_06: '1.06345678901234'
            bene_rsk_r_scre_07: '1.07345678901234'
            bene_rsk_r_scre_08: '1.08345678901234'
            bene_rsk_r_scre_09: '1.09345678901234'
            bene_rsk_r_scre_10: '1.10345678901234'
            bene_rsk_r_scre_11: '1.11345678901234'
            bene_rsk_r_scre_12: '1.12345678901234'
            esrd_score: '2.34567890123456'
            dis_score: '0.98765432109876'
            agdu_score: '1.23456789012345'
            agnd_score: '0.5'
            dem_esrd_score: '1.00100000000001'
            dem_dis_score: '0.44444444444444'
            dem_agdu_score: '1.1'
            dem_agnd_score: '0.99999999999999'
            bene_psnyrs_dual: '0.41666666666667'
    expect:
      format: sql
      # The numeric literals carry an exponent on purpose. A plain decimal
      # literal is unioned with the model's column at the column's own scale, so
      # on a two-decimal column it would be rounded to two decimals before the
      # comparison and the test would pass anyway. A float literal makes the
      # comparison happen in floating point, where the missing digits show.
      rows: |
        {%- set passthrough = [
            'bene_mbi_id', 'bene_hic_num', 'bene_1st_name', 'bene_last_name',
            'bene_sex_cd', 'bene_brth_dt', 'bene_death_dt', 'geo_ssa_cnty_cd_name',
            'geo_ssa_state_name', 'state_county_cd', 'in_va_max', 'va_tin', 'va_npi',
            'cba_flag', 'assignment_type', 'assigned_before', 'asg_status', 'partd_months',
            'hcc_version', 'new_enrollee', 'lti_status', 'bene_race_cd', 'directory_name'
        ] -%}
        {%- for i in range(1, 13) %}{% do passthrough.append('enrollflag' ~ i) %}{% endfor -%}
        {%- for i in range(1, 121) %}{% do passthrough.append('hcc_col_' ~ i) %}{% endfor -%}
        select
        {%- for column in passthrough %}
          null as {{ column }},
        {%- endfor %}
        {%- for i in range(1, 13) %}
          1.{{ '%02d' % i }}345678901234e0 as bene_rsk_r_scre_{{ '%02d' % i }},
        {%- endfor %}
          2.34567890123456e0 as esrd_score,
          0.98765432109876e0 as dis_score,
          1.23456789012345e0 as agdu_score,
          0.5e0 as agnd_score,
          1.00100000000001e0 as dem_esrd_score,
          0.44444444444444e0 as dem_dis_score,
          1.1e0 as dem_agdu_score,
          0.99999999999999e0 as dem_agnd_score,
          0.41666666666667e0 as bene_psnyrs_dual,
          'P.A0001.ACO.AALR.2023Q4.D231001.T0000000_1-1.csv' as file_name,
          'AALR' as file_type,
          '2023Q4' as file_period,
          '2023' as performance_year,
          'T0000000_1-1' as iteration
