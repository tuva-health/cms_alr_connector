
name: 'cms_aalr_connector'
version: '1.0.0'

profile: 'default'

flags:
  # Tuva Core 1.0 resolves refs inside a package before the root project.
  # dbt reads flags only from the root project, so a project that installs
  # this connector must set it too (see the README).
  require_ref_searches_node_package_before_root: true

vars:
  input_database: tuva
  input_schema: raw_data

  claims_enabled: true
  provider_attribution_enabled: true
  cms_alr_connector: true

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

models:
   cms_aalr_connector:
     final:
       +materialized: table
     intermediate:
       +materialized: table
     staging:
       +materialized: view

